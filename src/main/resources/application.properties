
#  AI Resume Analyzer - Application Config
# --- Server ---
server.port=8080

# --- MySQL Database ---
# Change username/password to match your MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/resume_analyzer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username= root
spring.datasource.password= Your Password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- File Upload (10MB max for PDF resumes) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Skills dataset location (relative to src/main/resources/) ---
app.dataset.skills-path=dataset/skills.txt

# --- Logging ---
logging.level.com.resumeai=INFO
logging.level.org.springframework.web=WARN
# Suppress LanguageTool verbose output
logging.level.org.languagetool=WARN
logging.level.org.apache.opennlp=WARN
